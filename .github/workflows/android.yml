name: Android CI

# Three jobs:
#   verify-pin — core pin bumps ONLY. Seconds, no build. See its own note.
#   check      — unit tests + lint. Gates the build. Skipped on core pin bumps.
#   build      — assembles the APK, and publishes a GitHub Release on v* tags. Never runs for a PR,
#                so PR branches still don't produce APKs (the restriction added in ac33c65 is
#                unchanged); they only get the test/lint verdict.
on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write   # required so tag builds can create a Release

# Core (tv.own.owntv:core, :player-core) and the mpv engine (tv.own.owntv:libmpv) resolve from OwnTV's
# public Maven repository, https://ahxn00.github.io/OwnTV_Core/maven — no token, so fork pull requests
# build exactly like the maintainer's. There is no owntv.corePath here: CI deliberately builds against
# the PINNED artifact, which is what a release actually ships. Local builds use the composite.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A "Pin core x.y.z" pull request opened by core's bump-consumers workflow changes exactly two
  # files and no application code. Running the unit tests, lint and the i18n checks on it re-verifies
  # this repo's Kotlin, which is byte-identical to main — minutes of runner time that cannot report
  # anything new. So those jobs step aside for these branches and this one runs instead.
  #
  # It also keeps the workflow run itself concluding "success". A run whose every job is skipped
  # concludes as "skipped", and automerge-core-bump.yml requires success — skip everything and the
  # pull request would sit open for ever.
  #
  # What is actually worth checking on such a pull request is that the numbers agree: seconds, no
  # build, no Gradle, no Android SDK.
  verify-pin:
    if: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'bump/core-') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: The pin must be core's newest release, and locales.json must match it
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail

          PIN=$(sed -n 's/^owntvCore = "\(.*\)"$/\1/p' gradle/libs.versions.toml)
          [ -n "$PIN" ] || { echo "::error::Could not read owntvCore from gradle/libs.versions.toml."; exit 1; }

          # The branch name carries the version too, so a mismatch means the two halves of the bump
          # disagree about what is being pinned.
          if [ "$HEAD_BRANCH" != "bump/core-$PIN" ]; then
            echo "::error::Branch $HEAD_BRANCH does not match the pin $PIN."
            exit 1
          fi

          # Core publishes the release only AFTER its tests pass and both artifacts are pushed, so a
          # release existing is proof the version is real and installable.
          LATEST=$(gh api repos/ahXN00/OwnTV_Core/releases/latest --jq .tag_name)
          LATEST="${LATEST#core-}"
          if [ "$PIN" != "$LATEST" ]; then
            echo "::error::Pinned $PIN but core's newest release is $LATEST."
            exit 1
          fi

          # The other file the bump touches. It is duplicated into every consumer because Gradle
          # reads it at configure time to build localeFilters, and core's own copy never reaches
          # here. A stale copy silently strips a language out of the APK with a green build.
          curl -fsSL -o /tmp/locales.core.json \
            "https://raw.githubusercontent.com/ahXN00/OwnTV_Core/core-$PIN/tools/i18n/locales.json"
          if ! diff -u /tmp/locales.core.json tools/i18n/locales.json; then
            echo "::error::tools/i18n/locales.json differs from core's copy at core-$PIN."
            exit 1
          fi

          echo "Pin $PIN is core's newest release, the branch agrees, and locales.json matches."

  # Nothing was checking the unit tests or lint before, so both could rot silently while the APK
  # kept building. This job is the gate: if it is red, no APK is produced and no release is cut.
  check:
    # Core pin bumps carry no application code — verify-pin above covers them instead.
    if: ${{ !(github.event_name == 'pull_request' && startsWith(github.head_ref, 'bump/core-')) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # 'tools' is obsolete and Google removed it from the SDK repository; the
          # action still asks for it by default, which fails the whole setup step.
          packages: 'platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # Exercise both compatibility profiles: they share features, but Legacy changes runtime limits.
      - name: Unit tests
        run: |
          chmod +x ./gradlew
          ./gradlew testNormalDebugUnitTest testLegacyDebugUnitTest --stacktrace

      # abortOnError = true in app/build.gradle.kts, so this fails the job on a lint error.
      - name: Lint
        if: always()   # report both verdicts in one run instead of one failure at a time
        run: ./gradlew lintNormalDebug lintLegacyDebug --stacktrace

      - name: Upload test and lint reports
        if: always()   # the reports matter most when the step above failed
        uses: actions/upload-artifact@v7
        with:
          name: check-reports
          path: |
            app/build/reports/tests/**
            app/build/reports/lint-results-*.html
            app/build/reports/lint-results-*.txt
          if-no-files-found: warn

  build:
    needs: check
    # PRs get the check job only — no APK, no release. Unchanged from ac33c65.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
      # Set at runtime via $GITHUB_ENV in the naming step. Declared here so workflow linters know
      # both versioned asset variables exist before the release step evaluates them.
      NORMAL_OUT: ""
      LEGACY_OUT: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'   # matches gradle/gradle-daemon-jvm.properties (toolchainVersion=21)

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # 'tools' is obsolete and Google removed it from the SDK repository; the
          # action still asks for it by default, which fails the whole setup step.
          packages: 'platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Compute version (from the git tag on releases)
        id: ver
        run: |
          # ZenPlay TV 2.1.8 was distributed with versionCode 100011. Android will refuse any
          # replacement whose code is lower, regardless of versionName. Reserve 100000 as the
          # ZenPlay epoch and encode M.mm.pp above it, so v2.1.9 is 120109 and every normal SemVer
          # release remains an upgrade from the installed 2.1.8 APK.
          if [ "$IS_TAG" = "true" ]; then
            NAME="${GITHUB_REF_NAME#v}"
            if ! [[ "$NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Release tags must be vMAJOR.MINOR.PATCH (received $GITHUB_REF_NAME)."
              exit 1
            fi
            IFS='.' read -r MA MI PA <<< "$NAME"
            if [ "$MI" -gt 99 ] || [ "$PA" -gt 99 ]; then
              echo "::error::MINOR and PATCH must each be between 0 and 99."
              exit 1
            fi
            CODE=$(( 100000 + MA * 10000 + MI * 100 + PA ))
            if [ "$CODE" -le 100011 ]; then
              echo "::error::versionCode $CODE must be newer than the installed ZenPlay 2.1.8 code 100011."
              exit 1
            fi
          else
            # Non-tag artifacts mirror app/build.gradle.kts and are never published as Releases.
            NAME="2.2.8"
            CODE=120208
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Version: $NAME (code $CODE)"

      - name: Decode signing keystore (if configured)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # Runs on every push (not just tags) so dev builds are also signed RELEASE builds —
          # required since R8 was enabled: only assembleRelease exercises shrinking/keep rules,
          # and a release-signed dev APK installs straight over a published release for testing.
          # Fork PRs have no secrets, so they fall back to a debug build below.
          if [ -n "$KEYSTORE_BASE64" ]; then
            if [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
              echo "::error::The signing keystore is configured but one or more signing secrets are missing."
              exit 1
            fi
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "Release signing configured."
          elif [ "$IS_TAG" = "true" ]; then
            echo "::error::A tagged ZenPlay release may not use an ephemeral CI debug key. Configure the preserved ZenPlay signing keystore first."
            exit 1
          else
            echo "No KEYSTORE_BASE64 secret set — building a debug-signed APK."
          fi

      # Derives this release's edge key for the default metadata/subtitle service. Falls back to the
      # static OWNTV_EDGE_KEY, then to "" — a fork has neither secret and the app uses its open base
      # URL, exactly as before.
      - name: Derive the release edge key
        env:
          OWNTV_EDGE_MASTER: ${{ secrets.OWNTV_EDGE_MASTER }}
          OWNTV_EDGE_KEY: ${{ secrets.OWNTV_EDGE_KEY }}
          VERSION_NAME: ${{ steps.ver.outputs.name }}
        run: |
          if [ -n "$OWNTV_EDGE_MASTER" ]; then
            # No trailing newline in the input; the server derives it the same way.
            KEY=$(printf '%s' "$VERSION_NAME" \
              | openssl dgst -sha256 -hmac "$OWNTV_EDGE_MASTER" -hex \
              | awk '{print $NF}')
            echo "::add-mask::$KEY"
            echo "OWNTV_EDGE_KEY=$KEY" >> "$GITHUB_ENV"
            echo "Derived the edge key for $VERSION_NAME."
          elif [ -n "$OWNTV_EDGE_KEY" ]; then
            echo "::add-mask::$OWNTV_EDGE_KEY"
            echo "OWNTV_EDGE_KEY=$OWNTV_EDGE_KEY" >> "$GITHUB_ENV"
            echo "No OWNTV_EDGE_MASTER — using the static edge key."
          else
            echo "No edge secret configured (fork build) — the app will use the unprotected base URL."
          fi

      - name: Build APK
        env:
          VERSION_NAME: ${{ steps.ver.outputs.name }}
          VERSION_CODE: ${{ steps.ver.outputs.code }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          # OWNTV_EDGE_KEY is exported into $GITHUB_ENV by the step above; app/build.gradle.kts reads
          # it as the env var it always did.
        run: |
          chmod +x ./gradlew
          if [ "$IS_TAG" = "true" ] && [ -z "$KEYSTORE_FILE" ]; then
            echo "::error::A tagged ZenPlay release requires the production signing secrets."
            exit 1
          fi
          if [ -n "$KEYSTORE_FILE" ]; then
            echo "Building the two signed ZenPlay compatibility APKs"
            ./gradlew :app:assembleNormalRelease :app:assembleLegacyRelease --stacktrace
            NORMAL_SRC=$(ls app/build/outputs/apk/normal/release/*.apk | head -n1)
            LEGACY_SRC=$(ls app/build/outputs/apk/legacy/release/*.apk | head -n1)
            echo "Built Normal: $NORMAL_SRC"
            echo "Built Legacy: $LEGACY_SRC"

            # Every public update must keep the signer used by ZenPlay TV 2.1.8. A different key
            # produces Android's generic "App not installed"/signature-conflict error on every
            # existing device. The certificate fingerprint is public metadata, not a secret.
            APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n1)
            if [ -z "$APKSIGNER" ]; then
              echo "::error::apksigner was not found in the Android SDK."
              exit 1
            fi
            EXPECTED_SIGNER="956cde3e1d4d96e3367a28860614e9a26998faa39bb2a94363fbf10a7b4c2f2c"
            for APK in "$NORMAL_SRC" "$LEGACY_SRC"; do
              "$APKSIGNER" verify --verbose "$APK"
              CERT_OUTPUT=$("$APKSIGNER" verify --verbose --print-certs "$APK" 2>&1)
              NORMALIZED_CERT_OUTPUT=$(printf '%s' "$CERT_OUTPUT" \
                | tr '[:upper:]' '[:lower:]' \
                | tr -d '[:space:]:')
              if ! printf '%s' "$NORMALIZED_CERT_OUTPUT" | grep -Fq "$EXPECTED_SIGNER"; then
                printf '%s\n' "$CERT_OUTPUT"
                echo "::error::$APK does not contain the expected ZenPlay signer fingerprint."
                exit 1
              fi
              if unzip -l "$APK" | grep -q 'lib/x86_64/'; then
                echo "::error::$APK contains development-only x86_64 libraries."
                exit 1
              fi
            done
            echo "NORMAL_SRC=$NORMAL_SRC" >> "$GITHUB_ENV"
            echo "LEGACY_SRC=$LEGACY_SRC" >> "$GITHUB_ENV"
          else
            echo "Building unsigned/debug Normal and Legacy APKs"
            ./gradlew :app:assembleNormalDebug :app:assembleLegacyDebug
            NORMAL_SRC=$(ls app/build/outputs/apk/normal/debug/*.apk | head -n1)
            LEGACY_SRC=$(ls app/build/outputs/apk/legacy/debug/*.apk | head -n1)
            echo "Built Normal: $NORMAL_SRC"
            echo "Built Legacy: $LEGACY_SRC"
            echo "NORMAL_SRC=$NORMAL_SRC" >> "$GITHUB_ENV"
            echo "LEGACY_SRC=$LEGACY_SRC" >> "$GITHUB_ENV"
          fi

      - name: Name the ZenPlay Universal APKs
        run: |
          mkdir -p dist
          if [ "$IS_TAG" = "true" ]; then
            NORMAL_OUT="ZenPlay-v${{ steps.ver.outputs.name }}.apk"
            LEGACY_OUT="ZenPlayLegacy-v${{ steps.ver.outputs.name }}.apk"
          else
            NORMAL_OUT="ZenPlay-dev-${GITHUB_SHA::7}.apk"
            LEGACY_OUT="ZenPlayLegacy-dev-${GITHUB_SHA::7}.apk"
          fi
          cp "$NORMAL_SRC" "dist/$NORMAL_OUT"
          cp "$LEGACY_SRC" "dist/$LEGACY_OUT"
          echo "NORMAL_OUT=$NORMAL_OUT" >> "$GITHUB_ENV"
          echo "LEGACY_OUT=$LEGACY_OUT" >> "$GITHUB_ENV"
          echo "Packaged Normal and Legacy (arm64-v8a + armeabi-v7a)"
          # Stable aliases keep Downloader and customer links unchanged across every future version.
          if [ "$IS_TAG" = "true" ]; then
            cp "$NORMAL_SRC" "dist/ZenPlay.apk"
            cp "$LEGACY_SRC" "dist/ZenPlayLegacy.apk"
            if ! cmp -s "dist/$NORMAL_OUT" dist/ZenPlay.apk; then
              echo "::error::ZenPlay.apk does not match its versioned Normal APK."
              exit 1
            fi
            if ! cmp -s "dist/$LEGACY_OUT" dist/ZenPlayLegacy.apk; then
              echo "::error::ZenPlayLegacy.apk does not match its versioned Legacy APK."
              exit 1
            fi
            if cmp -s dist/ZenPlay.apk dist/ZenPlayLegacy.apk; then
              echo "::error::Normal and Legacy APKs are unexpectedly identical."
              exit 1
            fi
          fi

      - name: Generate and verify APK checksums
        if: env.IS_TAG == 'true'
        run: |
          cd dist
          sha256sum \
            "$NORMAL_OUT" \
            "$LEGACY_OUT" \
            ZenPlay.apk \
            ZenPlayLegacy.apk \
            > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: ZenPlay-Android-${{ github.sha }}
          path: dist/*
          if-no-files-found: error

      - name: Extract release notes from CHANGELOG.md
        if: env.IS_TAG == 'true'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # The release body is what the in-app updater shows as "What's new", so it must be the
          # SHORT, bullet-only notes from CHANGELOG.md (the only changelog; detail lives in commits).
          #
          # This runs here rather than only in release-notes.yml because a release published by
          # GITHUB_TOKEN does not trigger other workflows, so that job never fires for tag builds.
          # It stays as a fallback for releases published by hand from the GitHub UI.
          #
          # Take "## <tag>" up to the next "## v" header; the header may carry a date/"unreleased"
          # tail ("## v4.1.5 — 2026-07-26") or nothing at all, so match the version as a whole word.
          if [ -f CHANGELOG.md ]; then
            awk -v ver="$TAG" '
              $0 ~ ("^## " ver "([ \t]|$)") { flag=1; next }
              /^## v/ && flag { flag=0 }
              flag { print }
            ' CHANGELOG.md > dist/RELEASE_NOTES.md || true
            # Trim leading/trailing blank lines.
            sed -i -e '/./,$!d' dist/RELEASE_NOTES.md
            awk 'NF{p=NR} {a[NR]=$0} END{for(i=1;i<=p;i++) print a[i]}' \
              dist/RELEASE_NOTES.md > dist/RELEASE_NOTES.trimmed.md
            mv dist/RELEASE_NOTES.trimmed.md dist/RELEASE_NOTES.md
          fi
          if [ ! -s dist/RELEASE_NOTES.md ]; then
            echo "::warning::No CHANGELOG.md section for $TAG — publishing a placeholder body."
            echo "See the commits for $TAG for details." \
              > dist/RELEASE_NOTES.md
          fi
          echo "--- Release notes ---"
          cat dist/RELEASE_NOTES.md

      - name: Publish GitHub Release
        if: env.IS_TAG == 'true'
        uses: softprops/action-gh-release@v3
        with:
          name: ZenPlay Universal ${{ github.ref_name }}
          files: |
            dist/${{ env.NORMAL_OUT }}
            dist/${{ env.LEGACY_OUT }}
            dist/ZenPlay.apk
            dist/ZenPlayLegacy.apk
            dist/SHA256SUMS.txt
          body_path: dist/RELEASE_NOTES.md
          # Must stay false: it appends GitHub's auto commit/PR list under the body, which buries the
          # short in-app notes the updater dialog shows.
          generate_release_notes: false
